name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    uses: JakobMelchard/.github/.github/workflows/release.yml@baeda3e262210ce1619b843985fe9ceb84f92199 # v2.8.2
    permissions:
      contents: read
      id-token: write

  # Attach the binary to the release just cut.
  binary:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: swift build -c release
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: gh release upload "$TAG" .build/release/fmsh
