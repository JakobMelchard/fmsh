# XcodeGen spec. `xcodegen generate` writes Fmsh.xcodeproj (git-ignored).
name: Fmsh
options:
  bundleIdPrefix: org.melchard
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Fmsh:
    type: application
    platform: macOS
    sources:
      - path: Fmsh
    settings:
      base:
        INFOPLIST_FILE: Fmsh/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.melchard.fmsh
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  FmshTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FmshTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Fmsh
schemes:
  Fmsh:
    build:
      targets:
        Fmsh: all
        FmshTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [FmshTests]
